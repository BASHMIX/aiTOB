services:
  postgres:
    image: postgres:17-alpine
    container_name: aitob_postgres
    environment:
      # Select the runtime database explicitly for cutover/recovery.  The
      # default keeps the development database name; a reviewed deployment can
      # point API/BOT at a separately migrated database without changing code.
      POSTGRES_DB: ${AITOB_POSTGRES_DB:-aitob}
      POSTGRES_USER: aitob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    ports:
      # Do not disturb an existing local PostgreSQL service on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitob -d ${AITOB_POSTGRES_DB:-aitob}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    container_name: tourney_api
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://aitob:${POSTGRES_PASSWORD}@postgres:5432/${AITOB_POSTGRES_DB:-aitob}
      # Service-level encryption keys are injected from the local ignored
      # environment (or the deployment secret store); they are never stored
      # in PostgreSQL or returned by the API.
      AITOB_INTEGRATION_MASTER_KEY: ${AITOB_INTEGRATION_MASTER_KEY:?Set AITOB_INTEGRATION_MASTER_KEY}
      AITOB_AI_SERVICE_MASTER_KEY: ${AITOB_AI_SERVICE_MASTER_KEY:?Set AITOB_AI_SERVICE_MASTER_KEY}
      AITOB_AUTH_MASTER_KEY: ${AITOB_AUTH_MASTER_KEY:?Set AITOB_AUTH_MASTER_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set the platform Discord bot token}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set the Discord application client ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set the Discord OAuth client secret}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:?Set the Discord OAuth callback URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set the public frontend URL}
      # Cutover/recovery can pause all API-owned workers before resuming them.
      AITOB_DISABLE_BACKGROUND_WORKERS: ${AITOB_DISABLE_BACKGROUND_WORKERS:-false}
    volumes:
      # Persist only mutable avatar uploads. The React dist directory remains
      # image-owned so every deployment serves the newly built frontend.
      - avatars_data:/app/backend/api/static/avatars
      # Persist overlay configs per slot using a named volume
      - overlay_configs:/app/backend/api/overlay_configs
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /docs only proves the HTTP server exists; readiness proves the
      # PostgreSQL transport and schema are available before dependants start.
      test: ["CMD", "curl", "-f", "http://localhost:8000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      target: bot
    container_name: tourney_bot
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://aitob:${POSTGRES_PASSWORD}@postgres:5432/${AITOB_POSTGRES_DB:-aitob}
      AITOB_INTEGRATION_MASTER_KEY: ${AITOB_INTEGRATION_MASTER_KEY:?Set AITOB_INTEGRATION_MASTER_KEY}
      AITOB_AI_SERVICE_MASTER_KEY: ${AITOB_AI_SERVICE_MASTER_KEY:?Set AITOB_AI_SERVICE_MASTER_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set the platform Discord bot token}
      AITOB_DISABLE_BACKGROUND_WORKERS: ${AITOB_DISABLE_BACKGROUND_WORKERS:-false}
    volumes:
      # Share only mutable avatars with the API. Runtime state is PostgreSQL
      # and frontend assets remain immutable inside the API image.
      - avatars_data:/app/backend/api/static/avatars
    restart: always
    depends_on:
      api:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tourney_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - api

volumes:
  postgres_data:
  avatars_data:
  overlay_configs:
