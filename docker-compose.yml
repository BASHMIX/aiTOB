services:
  api:
    build:
      context: .
      target: api
    container_name: tourney_api
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    volumes:
      # Persist the SQLite database using a named volume
      - db_data:/app/backend/core
      # Persist player avatars and static uploads using a named volume
      - static_data:/app/backend/api/static
      # Persist overlay configs per slot using a named volume
      - overlay_configs:/app/backend/api/overlay_configs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      target: bot
    container_name: tourney_bot
    env_file:
      - .env.production
    volumes:
      # Share the same database and avatars as the API
      - db_data:/app/backend/core
      - static_data:/app/backend/api/static
    restart: always
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tourney_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - api

volumes:
  db_data:
  static_data:
  overlay_configs:
