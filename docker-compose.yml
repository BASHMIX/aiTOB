services:
  postgres:
    image: postgres:17-alpine
    container_name: aitob_postgres
    environment:
      POSTGRES_DB: aitob
      POSTGRES_USER: aitob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    ports:
      # Do not disturb an existing local PostgreSQL service on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitob -d aitob"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    container_name: tourney_api
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://aitob:${POSTGRES_PASSWORD}@postgres:5432/aitob
      # Service-level encryption keys are injected from the local ignored
      # environment (or the deployment secret store); they are never stored
      # in PostgreSQL or returned by the API.
      AITOB_INTEGRATION_MASTER_KEY: ${AITOB_INTEGRATION_MASTER_KEY:?Set AITOB_INTEGRATION_MASTER_KEY}
      AITOB_AI_SERVICE_MASTER_KEY: ${AITOB_AI_SERVICE_MASTER_KEY:?Set AITOB_AI_SERVICE_MASTER_KEY}
    volumes:
      # Persist the SQLite database using a named volume
      - db_data:/app/backend/core
      # Persist player avatars and static uploads using a named volume
      - static_data:/app/backend/api/static
      # Persist overlay configs per slot using a named volume
      - overlay_configs:/app/backend/api/overlay_configs
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      target: bot
    container_name: tourney_bot
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://aitob:${POSTGRES_PASSWORD}@postgres:5432/aitob
      AITOB_INTEGRATION_MASTER_KEY: ${AITOB_INTEGRATION_MASTER_KEY:?Set AITOB_INTEGRATION_MASTER_KEY}
      AITOB_AI_SERVICE_MASTER_KEY: ${AITOB_AI_SERVICE_MASTER_KEY:?Set AITOB_AI_SERVICE_MASTER_KEY}
    volumes:
      # Share the same database and avatars as the API
      - db_data:/app/backend/core
      - static_data:/app/backend/api/static
    restart: always
    depends_on:
      api:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tourney_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - api

volumes:
  postgres_data:
  db_data:
  static_data:
  overlay_configs:
